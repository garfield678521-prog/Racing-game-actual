<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Pseudo-Racer & Garage</title>
    <style>
        :root { --neon: #00f3ff; --pink: #ff0055; --bg: #0a0a0f; }
        body { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
        #wrapper { width: 100vw; max-width: 440px; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 10px; box-sizing: border-box; }
        #canvas-container { position: relative; width: 100%; height: 45vh; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #222; }
        canvas { width: 100%; height: 100%; display: block; }
        .hud { position: absolute; top: 12px; left: 12px; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 6px; border: 1px solid #333; pointer-events: none; line-height: 1.5; }
        .hud span { color: var(--neon); font-weight: bold; }
        .panel { background: #14161f; padding: 10px; border-radius: 12px; border: 1px solid #2a2d3d; }
        .garage-title { text-align: center; margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8a8f9f; }
        .car-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .car-btn { background: #222530; border: 1px solid #444; border-radius: 6px; color: #aaa; padding: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .car-btn.active { background: linear-gradient(135deg, #007aff, #004499); color: #fff; border-color: var(--neon); }
        .controls { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; height: 22vh; }
        .drive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .pdl-grid { display: grid; grid-template-rows: 1fr 1fr; gap: 8px; }
        .ctrl { background: #1c1e24; border: 2px solid #333; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; color: #fff; font-weight: bold; cursor: pointer; }
        .ctrl:active { background: #333; }
        .pdl { font-size: 16px; font-weight: bold; background: #252830; }
        .pdl:active { background: #444; }
        #pdl-gas:active { background: #34c759; }
        #pdl-brake:active { background: #ff3b30; }
        .shifter-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 100%; }
        .shifter-layout .ctrl { font-size: 16px; background: #1b1d26; }
        .io-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .io-btn { background: #007aff; border: none; padding: 10px; border-radius: 8px; color: #fff; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; position: relative; }
        .io-btn input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    </style>
</head>
<body>

<div id="wrapper">
    <!-- Viewport Screen -->
    <div id="canvas-container">
        <canvas id="raceCanvas"></canvas>
        <div class="hud">
            Speed: <span id="txt-spd">0</span> km/h<br>
            RPM: <span id="txt-rpm">1000</span><br>
            Gear: <span id="txt-gear">1</span><br>
            Wallet: $<span id="txt-cash">500</span>
        </div>
    </div>

    <!-- Active Management Garage -->
    <div class="panel">
        <div class="garage-title">🏎️ Tuning Garage room</div>
        <div class="car-selector">
            <button class="car-btn active" id="btn-car0" onclick="selectCar(0)">AM-GT3 (Cyan)</button>
            <button class="car-btn" id="btn-car1" onclick="selectCar(1)">EV-Concept (Pink)</button>
        </div>
        <div class="io-bar">
            <button class="io-btn" onclick="saveData()">📥 Export (.racing)</button>
            <div class="io-btn" style="background:#34c759;">
                📤 Import (.racing)
                <input type="file" accept=".racing" onchange="loadData(event)">
            </div>
        </div>
    </div>

    <!-- System Mechanics & Driving Input Blocks -->
    <div class="controls">
        <div class="drive-grid">
            <div class="ctrl" id="pdl-left">◀</div>
            <div class="ctrl" id="pdl-right">▶</div>
        </div>
        <div class="pdl-grid">
            <div class="shifter-layout">
                <div class="ctrl" id="shift-up">⚙️+</div>
                <div class="ctrl" id="shift-down">⚙️-</div>
            </div>
            <div class="drive-grid">
                <div class="ctrl pdl" id="pdl-brake">BRAKE</div>
                <div class="ctrl pdl" id="pdl-gas">GAS</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("raceCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Vehicles Setup Array
    const vehicles = [
        { id: "am_gt3", color: "#00f3ff", maxSpd: 220 },
        { id: "ev_concept", color: "#ff0055", maxSpd: 290 }
    ];

    // Global Core Architecture Game State (Synced to Custom File Output)
    let state = {
        fileType: "racingData",
        credits: 500,
        selectedCarIdx: 0,
        physics: { speed: 0, rpm: 1000, gear: 1, carX: 0 }
    };

    let trackY = 0;
    let inputs = { left: false, right: false, gas: false, brake: false };
    state.physics.carX = canvas.width / 2;

    // Manual Gearbox Physics Config
    const gearRatios = [0, 3.5, 2.4, 1.7, 1.2, 0.9]; 
    const maxRpm = 7500;

    // iPad / Mobile On-Screen Interception Bindings
    function bind(id, prop) {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); inputs[prop] = true; });
        el.addEventListener("touchend", (e) => { e.preventDefault(); inputs[prop] = false; });
    }
    bind("pdl-left", "left");
    bind("pdl-right", "right");
    bind("pdl-gas", "gas");
    bind("pdl-brake", "brake");

    // Gear Shifting Listeners
    document.getElementById("shift-up").addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (state.physics.gear < 5) {
            state.physics.gear++;
            state.physics.rpm = Math.max(state.physics.rpm * 0.7, 1200);
        }
    });
    document.getElementById("shift-down").addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (state.physics.gear > 1) {
            state.physics.gear--;
            state.physics.rpm = Math.min(state.physics.rpm * 1.3, maxRpm);
        }
    });

    function selectCar(idx) {
        state.selectedCarIdx = idx;
        document.getElementById("btn-car0").classList.toggle("active", idx === 0);
        document.getElementById("btn-car1").classList.toggle("active", idx === 1);
    }

    // Pseudo-3D Graphics Engine Simulation Loop
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let horizon = canvas.height * 0.45;
        let activeCar = vehicles[state.selectedCarIdx];

        // 1. Draw Horizon Sky and Ground Elements
        ctx.fillStyle = "#07070d"; ctx.fillRect(0, 0, canvas.width, horizon);
        ctx.fillStyle = "#111217"; ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);

        // 2. Linear Engine RPM & Speed Calculations
        let targetRatio = gearRatios[state.physics.gear];
        if (inputs.gas) {
            state.physics.rpm += (160 / targetRatio);
            if (state.physics.rpm > maxRpm) state.physics.rpm = maxRpm;
            
            let optimalSpeed = (state.physics.rpm / maxRpm) * activeCar.maxSpd;
            state.physics.speed += (optimalSpeed - state.physics.speed) * 0.05;
        } else if (inputs.brake) {
            state.physics.speed = Math.max(state.physics.speed - 4, 0);
            state.physics.rpm = Math.max(state.physics.rpm - 180, 1000);
        } else {
            state.physics.speed = Math.max(state.physics.speed - 0.8, 0);
            state.physics.rpm = Math.max(state.physics.rpm - 40, 1000);
        }

        // Steer Tracking
        if (inputs.left) state.physics.carX = Math.max(state.physics.carX - 4, 60);
        if (inputs.right) state.physics.carX = Math.min(state.physics.carX + 4, canvas.width - 90);

        // 3. Render 3D Perspective Pseudo-Road Lines
        trackY += (state.physics.speed * 0.1);
        if (trackY > 40) trackY = 0;

        ctx.fillStyle = "#1e212b";
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2 - 20, horizon);
        ctx.lineTo(canvas.width / 2 + 20, horizon);
        ctx.lineTo(canvas.width - 30, canvas.height);
        ctx.lineTo(30, canvas.height);
        ctx.fill();

        // Moving Perspective Segments
        for (let i = 0; i < 8; i++) {
            let lineY = horizon + ((canvas.height - horizon) * ((i * 20 + trackY) % 160) / 160);
            let w = (lineY - horizon) * 0.1;
            ctx.fillStyle = varColor = (Math.floor((i + Math.floor(trackY/20)) % 2) === 0) ? varColor = "#ff0055" : "#fff";
            ctx.fillRect(canvas.width / 2 - w/2, lineY, w, 3);
        }

        // 4. Render Active Player Chassis Box
        ctx.fillStyle = activeCar.color;
        ctx.fillRect(state.physics.carX, canvas.height - 75, 34, 45);
        ctx.fillStyle = "#111"; // Wheels
        ctx.fillRect(state.physics.carX - 4, canvas.height - 65, 4, 12);
        ctx.fillRect(state.physics.carX + 34, canvas.height - 65, 4, 12);
        ctx.fillStyle = "#000"; // Windshield
                ctx.fillRect(state.physics.carX + 4, canvas.height - 68, 26, 8);

        // Score generation from movement velocity
        if (state.physics.speed > 10 && Math.random() < 0.01) {
            state.credits += 5;
        }

        // 5. Update Head-Up UI
        document.getElementById("txt-spd").innerText = Math.floor(state.physics.speed);
        document.getElementById("txt-rpm").innerText = Math.floor(state.physics.rpm);
        document.getElementById("txt-gear").innerText = state.physics.gear;
        document.getElementById("txt-cash").innerText = state.credits;

        requestAnimationFrame(loop);
    }

    // IO Custom Extension Processing Scripts
    function saveData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "driver_profile.racing"; // Fixed missing quotation marks here
        a.click();
    }

    function loadData(e) {
        const file = e.target.files[0]; // Fixed missing index selection here
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const parsed = JSON.parse(evt.target.result);
                if (parsed.fileType === "racingData") {
                    state = parsed;
                    selectCar(state.selectedCarIdx);
                    alert("Profile Signature Restored Successfully!");
                } else {
                    alert("Invalid game configuration architecture.");
                }
            } catch (err) {
                alert("File trace corrupted or incomplete.");
            }
        };
        reader.readAsText(file);
    }

    loop();
